<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071c36" />
    <meta
      name="description"
      content="Control de asistencia para el congreso COINSI: escaneo de DNI, padrón de inscritos, reportes PDF y CSV."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a63b5'/%3E%3Cpath d='M42 23a13 13 0 1 0 0 18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>COINSI · Control de asistencia</title>
    <script>
      // Aplica el tema guardado antes del primer render para evitar el destello.
      try {
        var raw = localStorage.getItem('coinsi.asistencia.v1');
        var theme = raw ? (JSON.parse(raw).config || {}).theme : 'auto';
        var dark =
          theme === 'dark' ||
          ((!theme || theme === 'auto') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este sistema necesita JavaScript activado para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
